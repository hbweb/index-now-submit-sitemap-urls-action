name: Test Submit URLs Action

on:
  pull_request:
    branches:
      - "**"
  push:
    branches:
      - master

permissions: read-all

jobs:
  test-submit-urls-action:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install dependencies
        shell: bash
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Submit single URL to IndexNow
        run: >
          python src/helper/submit.py
          --host goutsnap.com
          --api-key ab3ff050879f49dba39bc5689fcd9109
          --api-key-location https://goutsnap.com/ab3ff050879f49dba39bc5689fcd9109.txt
          --endpoint bing
          --urls https://goutsnap.com/gout-free-tools/
      - name: Submit multiple URLs to IndexNow
        run: >
          python src/helper/submit.py
          --host goutsnap.com
          --api-key ab3ff050879f49dba39bc5689fcd9109
          --api-key-location https://goutsnap.com/ab3ff050879f49dba39bc5689fcd9109.txt
          --endpoint yandex
          --urls "
            https://goutsnap.com/gout-free-tools/
            https://goutsnap.com/"
